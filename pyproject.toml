[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackseparator"
version = "0.4.1"
description = "Local offline six-stem audio separation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "soundfile==0.12.1", "demucs==4.0.1"]

[tool.setuptools.packages.find]
include = ["trackseparator*"]
